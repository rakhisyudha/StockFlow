services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow
      POSTGRES_DB: stockflow
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://stockflow:stockflow@db:5432/stockflow?sslmode=disable
    ports:
      - "${API_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
